name: AI PR Description

on:
  pull_request:
    types: [opened] # เพิ่ม reopened, synchronize ได้ถ้าอยากให้อัปเดตทุก push

permissions:
  contents: read
  pull-requests: write # แก้ PR body
  models: read # ปลดล็อก GitHub Models ให้ GITHUB_TOKEN

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # สร้าง diff โดยตัดไฟล์ขยะที่ทำให้โมเดลสับสน/กิน budget ออก
          # (lock files, ของ generate, dependency, ไฟล์ config เครื่องมือ)
          git diff "origin/$BASE_REF...HEAD" -- . \
            ':(exclude)**/*.lock' \
            ':(exclude)yarn.lock' \
            ':(exclude)package-lock.json' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude).claude/**' \
            ':(exclude)dist/**' \
            ':(exclude)node_modules/**' \
            ':(exclude)**/*.snap' \
            > /tmp/pr.diff
          head -c 60000 /tmp/pr.diff > /tmp/pr_truncated.diff

      - name: Generate description
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          system-prompt: |
            You are a senior backend engineer writing a pull-request description in
            THAI for a NestJS project. You will be given a git diff.

            Output Markdown with EXACTLY these three sections:
            ## สรุป
            1-2 ประโยคสมบูรณ์ว่า PR นี้ทำอะไร
            ## การเปลี่ยนแปลงหลัก
            - bullet ละ 1 ประโยคสมบูรณ์ ระบุว่าเพิ่ม/แก้ไฟล์หรือฟีเจอร์อะไร
            ## จุดที่ควร review เป็นพิเศษ
            - bullet สั้น ๆ

            กฎเหล็ก:
            - เขียนภาษาไทยที่เป็นประโยคสมบูรณ์ ห้ามทิ้งประโยคค้างหรือเว้นช่องว่างแทนคำ
            - อธิบายจาก "เจตนาของการเปลี่ยนแปลง" ไม่ใช่อ่าน diff ทีละบรรทัด
            - ห้ามคัดลอกข้อความ error, log, คำเตือน compiler, หรือ stack trace ใด ๆ ลงใน description
            - มองข้ามไฟล์ตั้งค่าเครื่องมือ/lock file ที่หลงเหลือ ให้โฟกัสที่ซอร์สโค้ดจริง
            - ตอบเฉพาะตัว description เป็น markdown เท่านั้น ห้ามมีคำนำหรือคำต่อท้าย
            - ห้ามครอบคำตอบทั้งก้อนด้วย code fence (``` หรือ ```markdown) เด็ดขาด
              ให้ขึ้นต้นด้วย "## สรุป" ตรง ๆ เพื่อให้ GitHub render เป็นหัวข้อจริง
          prompt-file: /tmp/pr_truncated.diff

      - name: Update PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_BODY: ${{ steps.ai.outputs.response }}
        run: |
          # เขียนผ่านไฟล์แทนการ interpolate ลง command ตรง ๆ (กัน shell injection)
          printf '%s' "$AI_BODY" > /tmp/pr_body_raw.md
          # safety net: ตัด code fence ที่โมเดลอาจครอบมา (บรรทัดแรก/สุดท้ายที่เป็น ```)
          sed -e '1{/^[[:space:]]*```/d}' -e '${/^[[:space:]]*```[[:space:]]*$/d}' \
            /tmp/pr_body_raw.md > /tmp/pr_body.md
          gh pr edit ${{ github.event.pull_request.number }} --body-file /tmp/pr_body.md
